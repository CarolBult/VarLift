<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VarLift User Guide</title>
    <link rel="icon" type="image/x-icon" href="/static/logos/VarLift.png">
    <!-- Relative links in the guide (images/...) resolve against the docs folder -->
    <base href="/guide/">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <style>
        body { margin: 0; background: #f7f8fa; color: #1f2933;
               font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .topBar { background: #b8c4d4; padding: 10px 24px; }
        .topBar a { color: #1c2a5a; font-weight: 600; text-decoration: none; }
        main { max-width: 980px; margin: 0 auto; padding: 16px 24px 64px; background: #fff; }
        h1, h2, h3, h4 { color: #1c2a5a; line-height: 1.25; }
        h2 { border-bottom: 2px solid #e3e7ee; padding-bottom: 6px; margin-top: 2.2em; }
        img { max-width: 100%; height: auto; border: 1px solid #d5dbe5; border-radius: 4px; margin: 8px 0; }
        table { border-collapse: collapse; margin: 12px 0; font-size: 15px; display: block; overflow-x: auto; }
        th, td { border: 1px solid #d5dbe5; padding: 6px 10px; text-align: left; vertical-align: top; }
        th { background: #eef1f6; }
        code { background: #eef1f6; padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }
        hr { border: 0; border-top: 1px solid #e3e7ee; margin: 32px 0; }
        a { color: #1a56db; }
    </style>
</head>
<body>
    <div class="topBar"><a href="/">&larr; Back to VarLift</a></div>
    <main id="guide"><p>Loading the user guide&hellip;</p></main>
    <script>
        // GitHub-style heading anchors, so the guide's table of contents links work here too
        const slug = text => text.trim().toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s/g, '-');

        fetch('USER_GUIDE.md')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(md => {
                const main = document.getElementById('guide');
                main.innerHTML = marked.parse(md);
                main.querySelectorAll('h1, h2, h3, h4').forEach(h => { h.id = slug(h.textContent); });
                // In-page links: <base> would otherwise send them to /guide/
                main.querySelectorAll('a[href^="#"]').forEach(a => {
                    a.addEventListener('click', e => {
                        e.preventDefault();
                        document.getElementById(a.getAttribute('href').slice(1))?.scrollIntoView();
                    });
                });
                // External links open in a new tab
                main.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
                // Links from the app can open a section, for example /help#4-how-variant-equivalence-is-scored
                if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
            })
            .catch(() => {
                document.getElementById('guide').innerHTML = '<p>The user guide could not be loaded.</p>';
            });
    </script>
</body>
</html>
