api:
  email: "cole.szeman@jax.org"
  ensembl_base_url: "https://rest.ensembl.org"
  interpro_base_url: "https://www.ebi.ac.uk/interpro/api/entry/pfam/"
  mousemine_base_url: "https://www.mousemine.org/mousemine/service/query/results"
  ols_base_url: "https://www.ebi.ac.uk/ols4/api/"

data:

  mp_hp_mapping: "https://raw.githubusercontent.com/mapping-commons/mh_mapping_initiative/master/mappings/mp_hp_mgi_all.sssom.tsv"
  mondo_obo: "https://purl.obolibrary.org/obo/mondo.obo"

  hpoa: "https://purl.obolibrary.org/obo/hp/hpoa/phenotype.hpoa"
  genes_to_phenotype: "https://purl.obolibrary.org/obo/hp/hpoa/genes_to_phenotype.txt"

  mgi_alleles: "https://fms.alliancegenome.org/download/VARIANT-ALLELE_NCBITaxon10090.tsv.gz"
  mgi_homology: "https://www.informatics.jax.org/downloads/reports/HOM_ProteinCoding.rpt"
  mgi_disease: "https://www.informatics.jax.org/downloads/reports/MGI_DiseaseMouseModel.rpt"
  mgi_phenotype: "https://www.informatics.jax.org/downloads/reports/ALL_Phenotype.rpt"

  clinvar_vcf: "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz"
  clinvar_tbi: "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz.tbi"

  ncbi_var_summary: "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/variant_summary.txt.gz"

  ensemble_version: "116"
  ensembl_hum_gff3: "https://ftp.ensembl.org/pub/release-{ensemble_version}/gff3/homo_sapiens/Homo_sapiens.GRCh38.{ensemble_version}.gff3.gz"
  ensembl_mus_gff3: "https://ftp.ensembl.org/pub/release-{ensemble_version}/gff3/mus_musculus/Mus_musculus.GRCm39.{ensemble_version}.gff3.gz"


paths:

  mp_hp_mapping: "app/data/MGI/mp_hp_mgi_all.sssom.tsv"

  amino_acids: "app/data/amino_acid_mapping.csv"

  clinvar_vcf: "app/data/NCBI/clinvar.grch38.vcf.gz"
  clinvar_tbi: "app/data/NCBI/clinvar.grch38.vcf.gz.tbi"

  ncbi_var_summary: "app/data/NCBI/variant_summary.tsv.gz"
  ncbi_var_summary_grch38: "app/data/NCBI/variant_summary_grch38.tsv"

  mgi_alleles: "app/data/MGI/VARIANT-ALLELE-MGI.tsv.gz"
  mgi_homology: "app/data/MGI/HOM_ProteinCoding.rpt"
  mgi_disease: "app/data/MGI/MGI_DiseaseMouseModel.rpt"
  mgi_phenotype: "app/data/MGI/ALL_Phenotype.rpt"

  mondo_obo: "app/data/MONDO/mondo.obo"
  mondo_xref_map: "app/data/MONDO/mondo_xref_map.json"
  mondo_term_map: "app/data/MONDO/mondo_term_map.json"

  hpoa: "app/data/HPO/phenotype.hpoa"
  genes_to_phenotype: "app/data/HPO/genes_to_phenotype.txt"

  ensembl_hum_gff3: "app/data/Ensembl/Homo_sapiens.GRCh38.{ensemble_version}.gff3.gz"
  ensembl_mus_gff3: "app/data/Ensembl/Mus_musculus.GRCm39.{ensemble_version}.gff3.gz"
  mouse_gene_pqt: "app/data/Ensembl/mouse_gene_data.parquet"
  human_gene_pqt: "app/data/Ensembl/human_gene_data.parquet"

  apptainer_main: "/main"
  apptainer_cache: "/opt/vep/.vep"
  vep_input: "app/vep/processing/input.vcf"
  vep_output: "app/vep/processing/output.json"

logging:
  file: "app/mapping.log"
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
